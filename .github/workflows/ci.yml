name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          uv venv --python "${{ matrix.python }}" "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  benchmark:
    name: regression benchmarks (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group benchmark
      - run: uv run python -m benchmarks.cases
      - run: >-
          uv run python -m benchmarks.retrieval
          --min-recall-at-1 0.70 --min-recall-at-5 0.60 --min-hit-rate 0.90
          --min-mrr 0.78 --min-lookup-success 1.0
      - run: uv run --group benchmark python -m benchmarks.micro --repetitions 10
