[project]
name = "mqtt-spec-mcp"
version = "0.1.0"
description = "Offline MCP server for navigating the OASIS MQTT 3.1.1 and 5.0 specifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Carter Tinney" }]
keywords = ["mqtt", "mcp", "model-context-protocol", "specification", "oasis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/cartertinney/mqtt-spec-mcp"
Specification-3-1-1 = "https://docs.oasis-open.org/mqtt/mqtt/v3.1.1/os/mqtt-v3.1.1-os.html"
Specification-5-0 = "https://docs.oasis-open.org/mqtt/mqtt/v5.0/os/mqtt-v5.0-os.html"

[project.optional-dependencies]
benchmark = [
    "inspect-ai==0.3.281; python_version >= '3.11'",
    "github-copilot-sdk==1.0.22; python_version >= '3.11'",
    "tiktoken==0.14.0",
]

[project.scripts]
mqtt-spec-mcp = "mqtt_spec_mcp.server:main"
mqtt-spec-bench-retrieval = "mqtt_spec_mcp.benchmark.retrieval:main"
mqtt-spec-bench-micro = "mqtt_spec_mcp.benchmark.micro:main"
mqtt-spec-bench-copilot = "mqtt_spec_mcp.benchmark.copilot_runner:main"
mqtt-spec-bench-report = "mqtt_spec_mcp.benchmark.report:main"

[project.entry-points.inspect_ai]
mqtt_spec_mcp = "mqtt_spec_mcp.benchmark.inspect_tasks"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "types-beautifulsoup4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mqtt_spec_mcp"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N", "S", "RET", "PIE", "TID", "PTH"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S101", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true
# Runner modules need the benchmark extra (Python 3.11+); CI checks them separately
# with: mypy --python-version 3.12 src/mqtt_spec_mcp/benchmark/*.py
exclude = ["src/mqtt_spec_mcp/benchmark/(copilot_runner|inspect_tasks|inspect_logs)\\.py$"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[[tool.mypy.overrides]]
# Optional benchmark-extra dependency, imported lazily by the microbenchmark.
module = ["tiktoken", "tiktoken.*"]
ignore_missing_imports = true
