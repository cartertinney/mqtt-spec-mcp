[project]
name = "mqtt-spec-mcp"
version = "0.1.0"
description = "Offline MCP server for navigating the OASIS MQTT 3.1.1 and 5.0 specifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Carter Tinney" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
]

[project.scripts]
mqtt-spec-mcp = "mqtt_spec_mcp.server:main"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "types-beautifulsoup4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mqtt_spec_mcp"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N", "S", "RET", "PIE", "TID", "PTH"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S101", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
