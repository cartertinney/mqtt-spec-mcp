[project]
name = "mqtt-spec-mcp"
version = "0.1.0"
description = "Offline MCP server for navigating the OASIS MQTT 3.1.1 and 5.0 specifications"
readme = "README.md"
# The code is MIT; the bundled indexes and returned excerpts are OASIS
# specification text, distributed under the OASIS notices in NOTICE.
license = "MIT AND LicenseRef-OASIS-Notices"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Carter Tinney" }]
keywords = ["mqtt", "mcp", "model-context-protocol", "specification", "oasis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/cartertinney/mqtt-spec-mcp"
Documentation = "https://github.com/cartertinney/mqtt-spec-mcp/blob/main/docs/TOOLS.md"
Repository = "https://github.com/cartertinney/mqtt-spec-mcp"
Issues = "https://github.com/cartertinney/mqtt-spec-mcp/issues"
Changelog = "https://github.com/cartertinney/mqtt-spec-mcp/releases"
"MQTT 3.1.1 Specification" = "https://docs.oasis-open.org/mqtt/mqtt/v3.1.1/errata01/os/mqtt-v3.1.1-errata01-os-complete.html"
"MQTT 5.0 Specification" = "https://docs.oasis-open.org/mqtt/mqtt/v5.0/os/mqtt-v5.0-os.html"

[project.scripts]
mqtt-spec-mcp = "mqtt_spec_mcp.server:main"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "types-beautifulsoup4",
]
benchmark = ["tiktoken==0.14.0"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mqtt_spec_mcp"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N", "S", "RET", "PIE", "TID", "PTH"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S101", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts", "tests", "benchmarks"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[[tool.mypy.overrides]]
# Optional tokenizer, imported lazily by the microbenchmark.
module = ["tiktoken", "tiktoken.*"]
ignore_missing_imports = true
